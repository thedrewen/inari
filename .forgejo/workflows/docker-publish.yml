name: Docker Publish

on:
  push:
    tags:
      - "*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:dind
        env:
          DOCKER_TLS_CERTDIR: ""
        options: --privileged
    env:
      DOCKER_HOST: tcp://docker:2375
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract tag prefix (e.g. "nightly" from "nightly-0.0.2")
        id: meta
        run: |
          TAG=${GITHUB_REF_NAME}
          PREFIX=${TAG%%-*}
          echo "full_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push
        run: |
          docker build \
            -t thedrewen/inari:${{ steps.meta.outputs.full_tag }} \
            -t thedrewen/inari:${{ steps.meta.outputs.prefix }} \
            .
          docker push thedrewen/inari:${{ steps.meta.outputs.full_tag }}
          docker push thedrewen/inari:${{ steps.meta.outputs.prefix }}
