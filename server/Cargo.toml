[package]
name = "inari"
version = "0.0.1"
edition = "2024"

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
futures-util = "0.3.33"
mediasoup = "0.25.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.24.0", features = ["v4"] }
warp = { version = "0.4.3", features = ["server", "websocket" ] }
