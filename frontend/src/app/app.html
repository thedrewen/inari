@if (pageState() == PageState.WAIT_FOR_CODE) {
    <header>
        <img class="logo" src="/assets/inari-inverted.svg" alt="inari-logo">
        <h1>
            Inari
        </h1>
    </header>
    <main>
        <h2>
            Welcome on Inari, enter the code provided in the game to log in!
        </h2>
        <div class="input">
            <input placeholder="XXXXXX" type="text">
        </div>
        <div class="button">
            <button>
                Log in
            </button>
        </div>
    </main>
}
