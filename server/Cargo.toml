[package]
name = "inari"
version = "1.2.1-nightly"
edition = "2024"

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
getset = "0.1.7"
futures-util = "0.3.34"
mediasoup = "0.27.0"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.25.0", features = ["v4"] }
warp = { version = "0.4.3", features = ["server", "websocket" ] }
event-listener-primitives = "2.0.2"
